[package]
name = "trafficsniffer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trafficsniffer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1.11.1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server-auto", "tokio"] }
hyper-rustls = { version = "0.27", features = ["http1", "rustls-native-certs"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
prometheus = "0.14.0"
hickory-resolver = { version = "0.26", features = ["tokio", "system-config"] }
